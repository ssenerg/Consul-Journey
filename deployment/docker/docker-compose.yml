name: "consul-journey"

services:
  consul:
    image: hashicorp/consul:2.0
    container_name: cj-consul
    restart: unless-stopped
    volumes:
      - cj_consul_data:/consul/data
    ports:
      - "8500:8500"       # HTTP API + UI
      - "8600:8600"       # DNS
    command: agent -dev -client=0.0.0.0 -ui
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cj_consul_data:
    driver: local
